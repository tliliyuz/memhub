repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        # .claude/hooks/ 由 governance sync 直接下发，contract_pack 按字节与
        # 平台权威副本比对；自动修复或重排格式会被判成漂移。
        exclude: ^\.claude/hooks/
      - id: ruff-format
        exclude: ^\.claude/hooks/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        # 平台受管文档与 guard 钩子按字节与 governance-platform 比对，
        # 平台源不一定带结尾换行；自动补换行会被 contract_pack 判成漂移。
        exclude: ^(docs/(contracts/governance-toml\.md|guides/(SDD|DOCUMENT_FORMAT|DOCUMENT_GOVERNANCE)\.md|tech/TIME_CONVENTIONS\.md)|\.claude/hooks/)
      - id: trailing-whitespace
        exclude: ^(docs/(contracts/governance-toml\.md|guides/(SDD|DOCUMENT_FORMAT|DOCUMENT_GOVERNANCE)\.md|tech/TIME_CONVENTIONS\.md)|\.claude/hooks/)
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
        # 同理：平台受管文档与钩子必须保持同步时的字节原样。
        exclude: ^(docs/(contracts/governance-toml\.md|guides/(SDD|DOCUMENT_FORMAT|DOCUMENT_GOVERNANCE)\.md|tech/TIME_CONVENTIONS\.md)|\.claude/hooks/)
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      # 治理平台统一入口（governance-platform 可编辑安装）。
      # tier 1 提交信息；tier 2 暂存区治理检查（文档结构/归属、ADR、环境键、
      # 入口镜像、原子层纯度）；tier 3 批量终验在 pre-push 执行。
      - id: governance-commit-msg
        name: 治理提交信息（tier 1）
        entry: python -m governance_lib commit-msg
        language: system
        stages: [commit-msg]

      - id: governance-staged-fast
        name: 治理暂存区快速检查（tier 2）
        entry: python -m governance_lib check --staged --fast
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: governance-verify
        name: 治理批量终验（tier 3）
        entry: python -m governance_lib verify
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: env-key-parity
        name: .env.example 与 ENVIRONMENT.md 键集一致
        entry: python scripts/check_env_example_keys.py
        language: system
        pass_filenames: false
        files: ^(\.env\.example|docs/tech/ENVIRONMENT\.md)$

      - id: mypy
        name: mypy strict
        entry: python -m mypy src
        language: system
        pass_filenames: false
        files: ^src/
        types: [python]

      - id: no-raw-sql
        name: 禁止手写 SQL（数据访问走 ORM/Core）
        entry: python scripts/check_no_raw_sql.py
        language: system
        pass_filenames: false
        files: ^src/

      - id: no-sync-io
        name: 禁止同步 I/O（全仓 async；进程走 proc 模块）
        entry: python scripts/check_async_io.py
        language: system
        pass_filenames: false
        files: ^src/
