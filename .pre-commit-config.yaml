repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: env-key-parity
        name: .env.example 与 ENVIRONMENT.md 键集一致
        entry: python scripts/check_env_example_keys.py
        language: system
        pass_filenames: false
        files: ^(\.env\.example|docs/tech/ENVIRONMENT\.md)$

      - id: mypy
        name: mypy strict
        entry: python -m mypy src
        language: system
        pass_filenames: false
        files: ^src/
        types: [python]

      - id: doc-format
        name: Markdown 文档格式与结构检查
        entry: python scripts/check_document_format.py --staged
        language: system
        pass_filenames: false
        files: '\.md$'

      - id: doc-ownership
        name: 文档权威归属检查
        entry: python scripts/check_document_ownership.py --staged
        language: system
        pass_filenames: false
        files: '\.md$'

      - id: adr-governance
        name: ADR 索引、状态与链接检查
        entry: python scripts/check_adr_governance.py
        language: system
        pass_filenames: false
        files: '^(docs/decisions/.*\.md|AGENTS\.md|CLAUDE\.md)$'

      - id: agent-entrypoints-sync
        name: 根级入口镜像检查
        entry: python scripts/check_agent_entrypoints_sync.py
        language: system
        pass_filenames: false
        files: '^(AGENTS|CLAUDE)\.md$'

      - id: no-raw-sql
        name: 禁止手写 SQL（数据访问走 ORM/Core）
        entry: python scripts/check_no_raw_sql.py
        language: system
        pass_filenames: false
        files: ^src/

      - id: no-sync-io
        name: 禁止同步 I/O（全仓 async；进程走 proc 模块）
        entry: python scripts/check_async_io.py
        language: system
        pass_filenames: false
        files: ^src/

      - id: commit-message
        name: 提交信息检查（禁用工具署名行）
        entry: python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
