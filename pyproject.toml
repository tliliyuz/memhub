[project]
name = "memhub"
version = "0.1.0"
description = "Memhub 2.0：本地采集推送、云端提炼、markdown 真源 + 图谱投影"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "python-frontmatter>=1.1,<2",
]

[project.optional-dependencies]
# 运行态存储的生产实现（云上共享 PG 实例）。dev stub 用 MemoryStore，不需要它。
postgres = [
    "psycopg[binary,pool]>=3.2,<3.3",
]
engine = [
    # 解析/切分/去重/图谱/向量/explorer 复用 semantica
    "semantica>=0.7.0,<0.8",
    # semantica explorer 的表单上传依赖，缺失时启动即报 "Form data requires python-multipart"
    "python-multipart>=0.0.9,<1",
]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
    "ruff>=0.6",
    "mypy>=1.11",
    # 让 `mypy src` 能解析 memhub.ingest.postgres（生产实现），测试也用它
    "psycopg[binary,pool]>=3.2,<3.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
memhub = "memhub.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true