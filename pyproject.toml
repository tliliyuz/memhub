[project]
name = "memhub"
version = "0.1.0"
description = "Memhub 2.0：本地采集推送、云端提炼、PostgreSQL 知识真源 + 图谱/检索"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "python-frontmatter>=1.1,<2",
]

[project.optional-dependencies]
# 运行态存储的生产实现（云上共享 PG 实例）。dev stub 用 MemoryStore，不需要它。
postgres = [
    "psycopg[binary,pool]>=3.2,<3.3",
    # 异步 ORM；psycopg 3 同时提供异步 dialect（postgresql+psycopg）
    "sqlalchemy>=2.0.30,<2.1",
    # kb_* 的 DDL 版本化（ADR-0013 §4）；迁移角色带外执行
    "alembic>=1.16,<2",
]
engine = [
    # 投影子系统下线后 semantica 已无代码引用；与离线 wheelhouse / 锁文件一起清理是独立任务
    "semantica>=0.7.0,<0.8",
    # kb-api 上传接口的 multipart 解析，缺失时启动即报 "Form data requires python-multipart"
    "python-multipart>=0.0.9,<1",
]
# 可选的远程 MCP 传输；stdio 和默认管理台不加载该 SDK。
mcp-http = ["mcp==2.3.0"]
# kb-api 本地热读缓存（ADR-0023，nodes/stats/audit）；缺它时按「缓存关闭」运行。
cache = ["redis>=5.0,<6"]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
    "ruff>=0.6",
    "mypy>=1.11",
    # 让 `mypy src` 能解析 memhub.ingest.postgres（生产实现），测试也用它
    "psycopg[binary,pool]>=3.2,<3.3",
    "sqlalchemy>=2.0.30,<2.1",
    # 迁移契约测试要跑 alembic upgrade/downgrade
    "alembic>=1.16,<2",
    # 存储协议改成 async 后，契约测试需要 pytest 的 async 支持
    "pytest-asyncio>=0.24,<2",
    # 读缓存测试要构造客户端（ADR-0023）
    "redis>=5.0,<6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
memhub = "memhub.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试辅助模块（如 env_loader）放在 tests/ 下，供 conftest 与用例直接导入。
pythonpath = ["tests"]
# StateStore 契约测试是 async 的；auto 模式省掉每个用例的 mark。
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
