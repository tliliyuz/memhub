# Alembic config for the knowledge tables (kb_*), see ADR-0013 section 4.
#
# NOTE: this file is read by Python's configparser with the platform default
# encoding (cp936 on some Windows machines), so it must stay ASCII-only even
# though project docs are written in Chinese.
#
# The DSN is not configured here: alembic/env.py reads
# MEMHUB_KB_MIGRATE_DB_URL (migration role, DDL, run out of band) or accepts an
# injected sqlalchemy.url / connection (tests, `memhub migrate-kb`).
# The runtime role MEMHUB_KB_DB_URL is DML-only and is never used for
# migrations.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# Independent from the runtime schema_migrations table (ADR-0013 section 4).
# The table lives in schema `kb`; env.py passes version_table_schema explicitly
# (production: always `kb`; injected connection: its current search_path), so
# this stays unqualified and is never resolved via search_path by accident.
version_table = alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
