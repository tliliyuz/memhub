# memhub 部署模板（服务器 43.142.18.23）
# 用法：docker compose -f /opt/memhub/app/compose.yml up -d
#
# 约束（与 cloud-server-86 对齐）：
# - 日志必须限流：这台机曾因 json-file 无限制写满 26G 盘。
# - 根文件系统只读；唯一可写卷是 /var/lib/memhub；/tmp 用限额 tmpfs。
# - 容器内进程以主机 memhub 用户（999:987）运行，数据文件归属正确。
# - **network_mode: host**：PostgreSQL 与 nginx 都只听宿主机 127.0.0.1，
#   桥接网络里的容器够不到 loopback；host 网络下 ingest 必须显式绑 127.0.0.1，
#   否则 0.0.0.0 会把 8700 暴露到公网。
# - 公网统一由宿主机 nginx 进入。
#
# oauth2-proxy（认证网关，用户已拍板）：
# - 监听 127.0.0.1:4180，不发布端口；公网只经 nginx 443。
# - 凭据（CLIENT_ID / CLIENT_SECRET / COOKIE_SECRET）走 env_file 注入，
#   /etc/memhub/env 0600；COOKIE_SECRET = `openssl rand -base64 32`，泄露即全员会话失效。
# - 凭据未填时本服务启动会失败——这是有意的：凭据到位前 nginx 不挂管理台，
#   不需要它先跑起来。`docker compose up -d ingest worker kb` 不含本服务。
#
# 563fefe 起管理台（kb-api）取代 explorer 挂到 `/`：图谱页由前端自带 cytoscape
# 渲染（/api/v1/kb/graph），explorer 容器不再需要，已从本文件移除。

x-defaults: &defaults
  user: "999:987"
  env_file: /etc/memhub/env
  network_mode: host
  read_only: true
  stop_grace_period: 30s
  tmpfs:
    - /tmp:size=64m,mode=1777
  volumes:
    - /var/lib/memhub:/var/lib/memhub
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "3"

services:
  ingest:
    <<: *defaults
    image: memhub/app:0.1.0
    container_name: memhub-ingest
    # 绑定地址由代码决定：MEMHUB_HTTP_HOST 优先，缺省 127.0.0.1；
    # 非回环需 --allow-non-loopback。部署后 `ss -lntp | grep 8700` 必须是
    # 127.0.0.1:8700，看到 0.0.0.0/[::] 立即回滚。
    # host 网络下没有 ports:，也不应该有——它会被忽略，只会误导。
    # 实测：空载 50MB，推一枚 190KB 批次后峰值 59MB（本机 venv），384m 是 6 倍余量。
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8700/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *defaults
    image: memhub/app-worker:0.1.0
    container_name: memhub-worker
    # 窗口在容器内门控；错峰表：21:00-02:00 提炼，02:00-05:00 让给 eval L2。
    # 窗口外是**常驻 sleep**（每 interval 醒一次看表），进程不退出，所以 unless-stopped
    # 不会造成重启循环。唯一会退出的是启动自检：配置缺失或 LLM 端点不可达 → exit 2。
    # 那种情况重试也不会变好，因此用 on-failure:5 而不是 unless-stopped——
    # 连续 5 次后停住，`docker ps -a` 一眼能看到，不会每分钟白起一次。
    # timer 场景不用本服务，直接一次性执行：
    #   docker run --rm ... memhub/app-worker:0.1.0 memhub worker --once
    # （--once 只跑一轮、不受窗口限制；退出码 0 全成功 / 1 有失败 / 2 配置错）
    command: ["memhub", "worker", "--window", "21:00-02:00", "--limit", "20"]
    restart: "on-failure:5"
    # 实测：抽一枚 60K 字符会话（5 段、54 节点 / 36 边）峰值 ~155MB（本机 venv），
    # 单并发 + 60K 输入上限让峰值有界。640m 是 4 倍余量。
    mem_limit: 640m
    memswap_limit: 640m

  kb:
    <<: *defaults
    # 管理台：静态前端 + /api/v1/kb/*。图谱页由前端 cytoscape 渲染，
    # 数据来自 /var/lib/memhub/kb/kg.json（由本服务在真源变更后重建）。
    image: memhub/app-kb:0.1.0
    container_name: memhub-kb
    # 上传接口把文件写进 /var/lib/memhub/data（raw_store），worker 轮询同一个卷。
    # 不连数据库：kb 只读 markdown 真源 + 文件队列，鉴权靠 nginx 的 oauth2-proxy。
    # kb-api 代码固定绑 127.0.0.1:8701（无 --allow-non-loopback 之类的开关）。
    # 实测：投影重建（437 节点 / 2631 边）峰值 ~143MB，384m 是 2.5 倍余量。
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8701/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  explorer:
    <<: *defaults
    # 563fefe 起不再部署：管理台自带图谱页，图谱投影由 kb-api 重建。
    # 保留本段仅作为回退参考——需要旧 explorer 时取消注释、把 nginx `/` 改回 8703。
    profiles: ["legacy"]
    image: memhub/app-worker:0.1.0
    container_name: memhub-explorer
    # 只读可视化：读 rebuild timer 产出的 kg.json，绑回环 8703，由 nginx 挂到 /。
    # 图谱不存在时 serve 直接 exit 2 —— 部署顺序必须是「先跑一次 rebuild」再起本服务，
    # 否则会连续重启 5 次后停住（on-failure:5 就是为这种情况设的）。
    command:
      - memhub
      - serve
      - --graph
      - /var/lib/memhub/kb/kg.json
      - --port
      - "8703"
      - --no-browser
    # HOME 默认在只读 rootfs 外的卷上，但 explorer 只需要一个可写缓存目录；
    # 用 tmpfs 里的 /tmp，重启即清，不污染数据卷。
    environment:
      HOME: /tmp
      TMPDIR: /tmp
    restart: "on-failure:5"
    # 实测：加载 6 节点图谱并渲染首页后容器占用 151MB，384m 是 2.5 倍余量。
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8703/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 认证网关（用户已拍板：oauth2-proxy，管理台不做 basic auth 过渡）。
  # 凭据只存在于 /etc/memhub/env（0600），由 env_file 注入，不进 git/compose。
  # **不要写 `environment: {OAUTH2_PROXY_CLIENT_ID: ${...}}`**：compose 的 `${}`
  # 只查宿主 shell/.env，不读 env_file，会把值覆盖成空串（部署时踩过）。
  # COOKIE_SECRET 必须是 32 字节随机数的 base64：
  #   openssl rand -base64 32
  # 公网 443 → nginx /oauth2/* 与受保护的 / → 127.0.0.1:4180；本服务不发布端口。
  # upstream 指向 kb-api（8701）：563fefe 起管理台取代 explorer 挂到 `/`。
  oauth2-proxy:
    <<: *defaults
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: memhub-oauth2-proxy
    command:
      - --http-address=127.0.0.1:4180
      - --provider=github
      - --upstream=http://127.0.0.1:8701
      - --redirect-url=https://memhub.work/oauth2/callback
      # v7.6.0 要求 email-domain 必须设置，否则启动即 invalid configuration；
      # 实际访问限制由 --github-user 白名单生效（用户选择「仅我的账号」）。
      - --email-domain=*
      - --github-user=tliliyuz
      - --cookie-name=memhub_oauth2
      - --cookie-secure=true
      - --cookie-httponly=true
      - --pass-access-token=false
      # 不要覆盖 --scope：GitHub provider 默认是 `user:email read:org`；v7.6.0 的
      # EnrichSession 会无条件列组织（/user/orgs），少了 read:org 回调直接
      # 500 `You need at least read:org scope`（线上已踩）。
      # rd 校验需要白名单，否则 https://memhub.work/ 被判非法、登录后只能回到 /。
      - --whitelist-domain=memhub.work
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    # 无 healthcheck：v7.6.0 镜像是 distroless（没有 shell / wget / curl），
    # 容器内起不了探针；存活状态看 `docker ps` 与 nginx 侧 502。
