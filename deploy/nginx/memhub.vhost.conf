# memhub.work vhost 草案（explorer + oauth2-proxy 版，待评审，未上线）
#
# 前提：
# - oauth2-proxy 凭据（client_id/client_secret/cookie_secret）未到位前，最后的
#   `location /` 段保持现状（→ 8125 死端口或现有静态页），explorer 容器可以先
#   跑起来但不挂。
# - 凭据到位后：本文件替换现 vhost → `nginx -t` → reload，一次生效。
#
# location 优先级说明（旧 vhost 注释里的坑，逐条核对过）：
# - nginx 匹配顺序：`=` 精确 > `^~` 前缀（跳过正则）> 正则（按顺序）> 普通前缀。
# - `location = /__ops_auth` 与 `location = /oauth2/auth` 都是 internal 精确匹配，
#   不会被其它前缀遮蔽。
# - ACME webroot 用 `^~`：确保 `.well-known/acme-challenge/` 不落入正则 location
#   （否则 certbot 续期静默失败，就是这里最容易踩）。
# - `/api/v1/` 用普通前缀即可：它不会被任何正则截走，因为本文件里唯一的正则
#   location 是 `\.well-known` 相关的 webroot 兜底（`^~` 后不再需要）。
# - `proxy_pass http://memhub_ingest/;` 尾部斜杠 = 去掉 `/api/v1/` 前缀，
#   与 ingest 内部路由（`/ingest/*`、`/devices/*`）对齐。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name memhub.work;

    ssl_certificate     /etc/letsencrypt/live/memhub.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memhub.work/privkey.pem;

    # 日志
    access_log /var/log/nginx/memhub.access.log;
    error_log  /var/log/nginx/memhub.error.log warn;

    # ---- ACME 续期（必须保留，^~ 防正则截胡）----
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # ---- 采集 API（原样保留，不经认证网关：采集端是设备 token 自鉴权）----
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8700/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- oauth2-proxy 自身端点（回调 + 认证判决 + 静态资源）----
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookie 必须透传给 oauth2-proxy（会话 cookie 在这里）
        proxy_pass_request_headers on;
        proxy_set_header Cookie $http_cookie;
    }

    # ---- explorer（受保护：/ 全部走 auth_request 判决）----
    # 判决子请求：internal、不带请求体、带 Cookie，2s 超时
    # （骨架来自 /root/pre-cleanup-20261118-1600/memhub.vhost，判决点由旧 8125
    #   改成 oauth2-proxy 的 /oauth2/auth）
    location = /__explorer_auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location / {
        # 凭据到位前：保持现状（死端口/静态页），下面这段不启用。
        # 启用 = 把 return 换成 auth_request + proxy_pass。
        #
        # auth_request /__explorer_auth;
        # error_page 401 = @explorer_login;
        # proxy_pass http://127.0.0.1:8703;
        # proxy_http_version 1.1;
        # proxy_set_header Connection "";
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_read_timeout 60s;
        #
        # 未启用时维持原状：
        proxy_pass http://127.0.0.1:8125;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # 未登录 → oauth2-proxy 登录流（302 到 GitHub → 回调 → 回来）
    location @explorer_login {
        return 302 /oauth2/start?rd=$scheme://$host$request_uri;
    }
}

# /portal 与 api.memhub.work 不在本草案范围：
# - memhub.work/portal 去留待用户决定（保留为 /portal/ 或撤掉）。
# - api.memhub.work 当前指向死端口 8096，需一并处理。
