# memhub.work vhost 合并版（explorer + oauth2-proxy，2026-11-19 已上线）
#
# 本文件 = 现网线上版本（含部署时按实际回改的 5 处，逐条见下方合并说明）。
# 部署记录：四容器（ingest/worker/explorer/oauth2-proxy）全部只监听 127.0.0.1；
# oauth2-proxy v7.6.0 + GitHub OAuth（--github-user 白名单）。
# 回退方式：`location /` 改回 `[OFF] return 404;`，或整体恢复到 git 上一版。
#
# 合并说明（评审结论落实，2026-11-19）：
# - 本文件是**整文件替换版**：已补齐评审指出的现网缺失段——port-80 301、
#   www server_name、安全头、TLS 加固、client_max_body_size、limit_req 全套、
#   /api/v1/healthz 404、/portal alias。
# - 部署回改（线上即此版本）：
#   1) `/api/v1/` 的 proxy_pass 必须带尾斜杠（`upstream/`），否则前缀透传 404；
#   2) 补 `error_page 429 = @memhub_limited;`，否则 429 信封是死 location；
#   3) `/portal` 实际目录为 /var/www/portal/，并加 `/portal` → `/portal/` 301。
# - 旧 sso 三个 location（→8125，后端已死）已移除——**显式确认项**，部署前若
#   用户要求保留请恢复（见 git 历史）。
# - limit_req zone（apizone/authzone/panelzone）**不在本文件定义**，依赖
#   nginx.conf http 块或 conf.d 的既有定义——与现网一致，合并时确认其存在。
# - upstream memhub_ingest + keepalive 16 沿用现网定义（文件头）。
# - explorer 双态：凭据到位后 `location /` 走 auth_request + proxy_pass 8703
#   （当前线上启用态）；凭据不可用时退回 `return 404`（不依赖旧 8125 死端口）。
#   两个状态用 `# [ON]` / `# [OFF]` 标注，切换只动这几行。

# ---- limit_req zone（依赖：nginx.conf http 块或 conf.d，非本文件）----
# apizone    : 现网已有，/api/v1/ 用，burst=20
# authzone   : 现网已有，认证类路由用
# panelzone  : 现网已有，面板路由用
# 本文件只引用不定义；zone 定义丢失时 nginx -t 会直接报错，属显式失败。

upstream memhub_ingest {
    server 127.0.0.1:8700;
    keepalive 16;
}

upstream memhub_explorer {
    server 127.0.0.1:8703;
}

# ---- oauth2-proxy：回调、登录、认证判决 ----
upstream memhub_oauth2 {
    server 127.0.0.1:4180;
}

server {
    listen 80;
    listen [::]:80;
    server_name memhub.work www.memhub.work;

    # ACME 续期必须在 80 上可达
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://memhub.work$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name memhub.work;

    ssl_certificate     /etc/letsencrypt/live/memhub.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memhub.work/privkey.pem;

    # ---- TLS 加固（现网既有，逐字保留）----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全头（现网既有，server 级 always）----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 限流（zone 定义在 http 块，见文件头注释）----
    limit_req_status 429;
    # 429 必须转成 JSON 信封；少了这行 @memhub_limited 就是死 location，
    # 客户端会拿到 nginx 默认 HTML 错误页（部署时踩过，别删）。
    error_page 429 = @memhub_limited;

    client_max_body_size 50m;

    # 日志
    access_log /var/log/nginx/memhub.access.log;
    error_log  /var/log/nginx/memhub.error.log warn;

    # ---- ACME 续期（必须保留，^~ 防正则截胡）----
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # ---- 健康端点公网隐藏（现网既有语义：公网 404，容器内本地 200）----
    location = /api/v1/healthz {
        limit_req zone=apizone burst=20 nodelay;
        return 404;
    }

    # ---- 采集 API（不经认证网关：设备 token 自鉴权）----
    location /api/v1/ {
        limit_req zone=apizone burst=20 nodelay;
        client_max_body_size 20m;
        # 尾斜杠不可省：去掉 /api/v1/ 前缀后 ingest 内部路由才是 /ingest/*、/devices/*；
        # 写成 `http://memhub_ingest` 会把前缀原样透传，所有采集路由 404（部署时踩过）。
        proxy_pass http://memhub_ingest/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 429 JSON 信封（现网既有，逐字保留）----
    location @memhub_limited {
        default_type application/json;
        return 429 '{"code":1007,"message":"rate limited","data":{}}';
    }

    # ---- oauth2-proxy 自身端点（回调 + 登录 + 静态资源）----
    location /oauth2/ {
        limit_req zone=authzone burst=20 nodelay;
        proxy_pass http://memhub_oauth2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookie 必须透传（会话 cookie 在这里）
        proxy_pass_request_headers on;
        proxy_set_header Cookie $http_cookie;
    }

    # ---- explorer 认证判决（internal，骨架沿旧 vhost 备份，判决点 /oauth2/auth）----
    location = /__explorer_auth {
        internal;
        proxy_pass http://memhub_oauth2/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # 未登录 → oauth2-proxy 登录流
    location @explorer_login {
        return 302 /oauth2/start?rd=$scheme://$host$request_uri;
    }

    # ---- /portal（现网既有静态页；去留待用户决定，保留现状）----
    # 现网实际目录是 /var/www/portal/（部署时按现网改回，勿写成 memhub-portal）
    location = /portal {
        return 301 /portal/;
    }

    location /portal/ {
        limit_req zone=panelzone burst=20 nodelay;
        alias /var/www/portal/;
        index index.html;
    }

    # ---- explorer（受保护：/ 全部走 auth_request；凭据已到位，线上为启用态）----
    # 凭据到位前若要回退：把下面 [ON] 行注释掉，改回 [OFF] 的 `return 404;`。
    location / {
        # [ON]
        auth_request /__explorer_auth;
        error_page 401 = @explorer_login;
        proxy_pass http://memhub_explorer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # [OFF] 凭据到位前：return 404;
    }
}

# ---- 显式移除项（评审第 8 点，勿静默恢复）----
# 旧 sso 三个 location（→ 127.0.0.1:8125）已删：后端已死。若用户要求保留，
# 从 git 历史恢复（本文件 77ca951 版本）。

# ---- 待用户决定 ----
# - /portal 去留：保留为 /portal/（本草案按保留处理）或撤掉。
# - api.memhub.work 死 vhost（→8096）：需一并处理，不在本文件范围。
